<!DOCTYPE html>
<html lang="pt-BR" data-tema="amarelo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VozGuia — assistente sonoro de mobilidade</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="../assets/logos/g3.svg">
<link rel="apple-touch-icon" href="../assets/logos/g3-192.png">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== VozGuia · voz em primeiro lugar: fundo preto, cor de destaque única, tipografia Atkinson Hyperlegible ===== */
:root{--fundo:#000;--txt:#fff;--dest:#ffd400;--sobre:#000;--sutil:#1a1a1a;--borda:#ffd400}
[data-tema=branco]{--dest:#fff;--sobre:#000;--borda:#fff}
[data-tema=claro]{--fundo:#fff;--txt:#000;--dest:#000;--sobre:#fff;--sutil:#eee;--borda:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fundo);color:var(--txt);font-family:"Atkinson Hyperlegible",Verdana,sans-serif;font-size:19px;line-height:1.4}
body{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.barra{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:3px solid var(--dest)}
.barra img{width:40px;height:40px;border-radius:10px}
.barra h1{font-size:22px;flex:1}
.estado{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dest)}
main{flex:1;display:flex;flex-direction:column;padding:14px;gap:14px;max-width:640px;width:100%;margin:0 auto}
/* o "pad": área de gestos que mostra o item em foco */
#pad{position:relative;min-height:38dvh;border:4px solid var(--dest);border-radius:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;touch-action:none;user-select:none;cursor:pointer}
#pad .pos{position:absolute;top:12px;left:0;right:0;font-size:14px;letter-spacing:.1em;color:var(--dest)}
#pad .item{font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.15}
#pad .dica{margin-top:12px;font-size:16px;opacity:.85}
#pad.pulso{animation:pulso .35s}
@keyframes pulso{50%{background:var(--dest);color:var(--sobre)}}
.controles{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.b{min-height:64px;border-radius:18px;border:3px solid var(--dest);background:transparent;font-weight:700;font-size:19px;cursor:pointer;padding:6px 10px}
.b.cheio{background:var(--dest);color:var(--sobre)}
.b:active{transform:scale(.97)}
.lista{display:flex;flex-direction:column;gap:10px}
.lista .b{text-align:left;width:100%}
.cartao{border:3px solid var(--dest);border-radius:18px;padding:14px}
.cartao h3{font-size:21px}
.meta{font-size:15px;opacity:.85}
.fila{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.fila .b{flex:1 1 130px}
label{display:block;font-weight:700;margin:10px 0 6px}
.in{width:100%;min-height:56px;border:3px solid var(--dest);border-radius:14px;background:var(--fundo);padding:10px 12px;font-size:19px}
textarea.in{min-height:96px}
.trilha{position:relative;height:18px;border:3px solid var(--dest);border-radius:12px;margin:12px 0}
.trilha i{position:absolute;top:-3px;bottom:-3px;width:6px;background:#ff3b30}
.trilha b{position:absolute;top:-10px;width:30px;height:30px;border-radius:50%;background:var(--dest);border:3px solid var(--fundo);transform:translateX(-50%);transition:left .6s linear}
.degraus{display:flex;gap:6px;flex-wrap:wrap}.degraus span{flex:1 1 80px;text-align:center;border:2px solid var(--dest);border-radius:10px;padding:6px;font-size:14px}
.degraus span.ok{background:var(--dest);color:var(--sobre);font-weight:700}
.foto{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:8px}
.nota{font-size:15px;border-left:6px solid var(--dest);padding:6px 10px;margin:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:5px solid var(--dest);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="barra">
  <img src="../assets/logos/g3.svg" alt="">
  <h1>VozGuia</h1>
  <span class="estado" id="estado">início</span>
</header>
<main id="main">
  <div id="pad" role="application" aria-roledescription="área de gestos" aria-label="Área de gestos. Deslize para os lados para trocar de opção, toque duas vezes para escolher, segure para ouvir de novo." tabindex="0">
    <span class="pos" id="pad-pos"></span>
    <span class="item" id="pad-item"></span>
    <span class="dica" id="pad-dica"></span>
  </div>
  <div class="controles">
    <button class="b" id="ant" aria-label="Opção anterior">◀</button>
    <button class="b cheio" id="ok" aria-label="Escolher esta opção">Escolher</button>
    <button class="b" id="prox" aria-label="Próxima opção">▶</button>
  </div>
  <section id="painel" aria-live="polite"></section>
</main>
<div class="sr" id="falado" aria-live="assertive"></div>

<script>
/* ============================================================================
   Construção do VozGuia: máquina de estados finita. Cada estado declara uma lista
   de itens {rotulo, fala, acao} e um "painel" opcional. O mesmo item é alcançado por
   gesto (deslizar/duplo toque/segurar), por teclado (setas/Enter) ou pelos botões grandes,
   e tudo é narrado por voz com um padrão de vibração próprio.
   ============================================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CH = 'vozguia:v2';
const semente = () => ({
  voz: 1, vibrar: true, tema: 'amarelo', tutorial: 0,
  obst: [
    { id: 'o1', tipo: 'Buraco na calçada', local: 'Av. Couto Magalhães, perto do nº 1200', conf: 4, baixa: 0, ativo: true, m: 60 },
    { id: 'o2', tipo: 'Mesa de bar na calçada', local: 'Rua Dom Orlando Chaves, esquina', conf: 2, baixa: 1, ativo: true, m: 140 },
    { id: 'o3', tipo: 'Semáforo sem sinal sonoro', local: 'Av. da FEB com Av. Couto Magalhães', conf: 7, baixa: 0, ativo: true, m: 230 },
  ],
  alertas: []
});
let S; try { S = JSON.parse(localStorage.getItem(CH)); } catch (e) {} if (!S) S = semente();
const salvar = () => localStorage.setItem(CH, JSON.stringify(S)); salvar();
document.documentElement.dataset.tema = S.tema;

/* ---------- saída: voz + vibração + região viva ---------- */
function falar(t, urgente) {
  $('#falado').textContent = t;
  if (!('speechSynthesis' in window)) return;
  if (urgente !== false) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-BR'; u.rate = S.voz; speechSynthesis.speak(u);
}
const PADROES = { passo: [30], escolha: [60, 40, 60], longe: [80], medio: [120, 80, 120], perto: [200, 60, 200, 60, 200], erro: [400] };
const vibrar = p => { if (S.vibrar && navigator.vibrate) try { navigator.vibrate(PADROES[p]); } catch (e) {} };

/* ---------- pontos próximos (exemplo: centro de Várzea Grande) ---------- */
const PONTOS = [
  { n: 'Ponto de ônibus da Avenida Couto Magalhães', m: 35, d: 'À sua direita, a cerca de trinta e cinco metros. Abrigo coberto, linhas para Cuiabá.' },
  { n: 'Faixa de pedestres com semáforo', m: 60, d: 'Em frente, a sessenta metros. Semáforo sem sinal sonoro, segundo o mapa colaborativo.' },
  { n: 'Farmácia', m: 90, d: 'À esquerda, a noventa metros. Entrada com rampa.' },
  { n: 'Unidade Básica de Saúde', m: 250, d: 'Em frente e depois à direita, a duzentos e cinquenta metros.' },
  { n: 'Prefeitura de Várzea Grande', m: 600, d: 'A seiscentos metros, na Avenida Castelo Branco.' },
];

/* ---------- caminhada de treino (simulada) ---------- */
const T = { m: 0, fim: 300, timer: null, avisados: {} };
function passoTreino() {
  T.m += 5; vibrar('passo');
  S.obst.filter(o => o.ativo).forEach(o => {
    const falta = o.m - T.m;
    [[30, 'longe', `Atenção: ${o.tipo} a trinta metros.`], [15, 'medio', `${o.tipo} a quinze metros. Reduza o passo.`], [5, 'perto', `Cuidado! ${o.tipo} a cinco metros, logo à frente.`]].forEach(([lim, p, frase]) => {
      const k = o.id + lim;
      if (falta <= lim && falta > lim - 5 && !T.avisados[k]) { T.avisados[k] = 1; vibrar(p); falar(frase); }
    });
  });
  if (T.m >= T.fim) { pararTreino(); falar('Chegada. Fim da caminhada de treino. Muito bem!'); vibrar('escolha'); }
  desenharTreino();
}
function iniciarTreino() { if (T.timer) return; if (T.m >= T.fim) reiniciarTreino(); falar('Caminhada de treino iniciada. Siga em frente.'); T.timer = setInterval(passoTreino, 900); desenharTreino(); }
function pararTreino() { clearInterval(T.timer); T.timer = null; desenharTreino(); }
function reiniciarTreino() { pararTreino(); T.m = 0; T.avisados = {}; desenharTreino(); }
function desenharTreino() {
  const el = $('#trilha'); if (!el) return;
  el.innerHTML = S.obst.filter(o => o.ativo).map(o => `<i style="left:${o.m / T.fim * 100}%" title="${esc(o.tipo)}"></i>`).join('') + `<b style="left:${T.m / T.fim * 100}%"></b>`;
  const prox = S.obst.filter(o => o.ativo && o.m > T.m).sort((a, b) => a.m - b.m)[0];
  $('#treino-txt').textContent = `${T.m} de ${T.fim} metros · ${T.timer ? 'andando' : 'parado'}` + (prox ? ` · próximo obstáculo: ${prox.tipo}, a ${prox.m - T.m} m` : ' · sem obstáculos à frente');
}

/* ---------- alertas ao poder público ---------- */
const ETAPAS = ['Enviado', 'Recebido pela ouvidoria', 'Em análise', 'Encaminhado à secretaria', 'Resolvido'];
async function reduzirFoto(arq) {
  const img = await createImageBitmap(arq); const esc = Math.min(1, 640 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: img.width * esc, height: img.height * esc });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .7);
}
let fotoTemp = null;

/* ---------- a máquina de estados ---------- */
const irPara = e => { location.hash = '#/' + e; };
const MAQ = {
  inicio: { titulo: 'início', itens: () => [
    { r: 'O que tem perto', a: () => irPara('perto') },
    { r: 'Caminhada de treino', a: () => irPara('treino') },
    { r: 'Mapa colaborativo', a: () => irPara('mapa') },
    { r: 'Avisar a prefeitura', a: () => irPara('alertas') },
    { r: 'Tutorial falado', a: () => irPara('tutorial') },
    { r: 'Ajustes', a: () => irPara('ajustes') },
  ], painel: () => `<div class="nota">Deslize para os lados no quadro amarelo para trocar de opção e toque duas vezes para escolher. Quem enxerga pode usar os botões. Pontos e obstáculos são <b>exemplos simulados</b> no centro de Várzea Grande.</div>` },

  perto: { titulo: 'perto de mim', itens: () => PONTOS.map(p => ({ r: p.n, f: `${p.n}. ${p.d}`, a: () => { falar(p.d); vibrar('escolha'); } })).concat([{ r: 'Descrever tudo', a: () => falar(PONTOS.map(p => p.n + ', ' + p.m + ' metros').join('. ')) }, voltar()]),
    painel: () => `<div class="lista">${PONTOS.map(p => `<div class="cartao"><h3>${esc(p.n)}</h3><p class="meta">${p.m} m · exemplo</p><p>${esc(p.d)}</p></div>`).join('')}</div>` },

  treino: { titulo: 'treino', itens: () => [
    { r: 'Começar a andar', a: iniciarTreino }, { r: 'Pausar', a: () => { pararTreino(); falar('Pausado.'); } },
    { r: 'Recomeçar do início', a: () => { reiniciarTreino(); falar('De volta ao início do percurso.'); } }, voltar()],
    painel: () => `<div class="cartao"><h3>Trecho de 300 m (simulado)</h3><p class="meta">Os alertas ficam mais fortes a 30, 15 e 5 metros de cada obstáculo do mapa colaborativo.</p>
      <div class="trilha" id="trilha" aria-hidden="true"></div><p id="treino-txt" aria-live="off"></p></div>`, depois: desenharTreino, sair: pararTreino },

  mapa: { titulo: 'mapa colaborativo', itens: () => S.obst.filter(o => o.ativo).map(o => ({ r: o.tipo, f: `${o.tipo}, ${o.local}. Confirmado por ${o.conf} pessoas. Toque duas vezes para confirmar que ainda está lá.`, a: () => { o.conf++; salvar(); falar('Obrigado. Confirmação registrada.'); vibrar('escolha'); render(); } })).concat([voltar()]),
    painel: () => `<div class="lista">${S.obst.map(o => `<div class="cartao" style="${o.ativo ? '' : 'opacity:.55'}"><h3>${esc(o.tipo)}</h3><p class="meta">${esc(o.local)} · ${o.conf} confirmaram · ${o.baixa} deram baixa${o.ativo ? '' : ' · <b>resolvido</b>'}</p>
      ${o.ativo ? `<div class="fila"><button class="b" data-conf="${o.id}">Ainda está lá</button><button class="b" data-baixa="${o.id}">Não está mais</button></div>` : ''}</div>`).join('')}
      <div class="cartao"><h3>Novo obstáculo</h3><label for="n-tipo">Tipo</label><select class="in" id="n-tipo"><option>Buraco na calçada</option><option>Calçada obstruída</option><option>Obra sem sinalização</option><option>Semáforo sem sinal sonoro</option><option>Piso tátil danificado</option></select>
      <label for="n-local">Onde</label><input class="in" id="n-local" placeholder="Rua e referência"><div class="fila"><button class="b cheio" id="n-add">Adicionar ao mapa</button></div></div></div>` },

  alertas: { titulo: 'avisar a prefeitura', itens: () => [{ r: 'Novo alerta', a: () => { $('#a-tipo').focus(); falar('Preencha o tipo, o local e, se quiser, uma foto. Depois toque em enviar.'); } }]
      .concat(S.alertas.map(a => ({ r: 'Protocolo ' + a.prot, f: `Protocolo ${a.prot}: ${a.tipo}. Situação: ${ETAPAS[a.etapa]}.`, a: () => falar(`Situação atual: ${ETAPAS[a.etapa]}.`) }))).concat([voltar()]),
    painel: () => `<div class="cartao"><h3>Novo alerta</h3>
      <label for="a-tipo">Tipo</label><select class="in" id="a-tipo"><option>Calçada</option><option>Travessia e semáforo</option><option>Ônibus e ponto</option><option>Iluminação</option><option>Outro</option></select>
      <label for="a-local">Local</label><input class="in" id="a-local" placeholder="Rua, número ou referência">
      <label for="a-desc">O que acontece</label><textarea class="in" id="a-desc"></textarea>
      <div class="fila"><button class="b" id="a-ditar">🎤 Ditar</button><label class="b" style="margin:0;display:grid;place-items:center" for="a-foto">📷 Foto</label></div>
      <input type="file" id="a-foto" accept="image/*" capture="environment" hidden><img id="a-prev" class="foto" alt="Prévia da foto" hidden>
      <div class="fila"><button class="b cheio" id="a-enviar">Enviar alerta</button></div>
      <p class="nota">Nesta versão o envio e o andamento são <b>simulados</b>; na real, o alerta vai para a ouvidoria de Várzea Grande.</p></div>
      <div class="lista" style="margin-top:12px">${S.alertas.map(a => `<div class="cartao"><h3>${esc(a.tipo)} · ${esc(a.prot)}</h3><p class="meta">${esc(a.local)} · ${new Date(a.quando).toLocaleString('pt-BR')}</p>
      ${a.desc ? `<p>${esc(a.desc)}</p>` : ''}${a.foto ? `<img class="foto" src="${a.foto}" alt="Foto enviada">` : ''}
      <div class="degraus" style="margin-top:10px">${ETAPAS.map((e, i) => `<span class="${i <= a.etapa ? 'ok' : ''}">${e}</span>`).join('')}</div>
      ${a.etapa < 4 ? `<div class="fila"><button class="b" data-avancar="${a.id}">Atualizar andamento (simulado)</button></div>` : ''}</div>`).join('')}</div>` },

  tutorial: { titulo: 'tutorial', itens: () => {
      const passos = ['Bem-vindo ao VozGuia. Este quadro grande é sua área de gestos.', 'Deslize o dedo para a direita para ir à próxima opção. Tente agora.', 'Deslize para a esquerda para voltar.', 'Toque duas vezes em qualquer lugar do quadro para escolher.', 'Segure o dedo no quadro para ouvir de novo.', 'Pronto! Você terminou o tutorial.'];
      return passos.map((p, i) => ({ r: `Passo ${i + 1} de ${passos.length}`, f: p, a: () => { S.tutorial = Math.max(S.tutorial, i + 1); salvar(); falar(i === passos.length - 1 ? 'Tutorial concluído. Voltando ao início.' : 'Muito bem!'); if (i === passos.length - 1) irPara('inicio'); } }));
    }, painel: () => `<div class="cartao"><h3>Progresso</h3><p>${S.tutorial} de 6 passos concluídos.</p><p class="meta">Pesquisas mostram que tecnologias assistivas são abandonadas quando falta treino — por isso o tutorial vem primeiro.</p></div>` },

  ajustes: { titulo: 'ajustes', itens: () => [
    { r: `Voz ${S.voz > 1 ? 'rápida' : S.voz < 1 ? 'lenta' : 'normal'}`, a: () => { S.voz = S.voz >= 1.4 ? .8 : +(S.voz + .2).toFixed(1); salvar(); render(); falar('Velocidade alterada.'); } },
    { r: `Vibração ${S.vibrar ? 'ligada' : 'desligada'}`, a: () => { S.vibrar = !S.vibrar; salvar(); render(); falar(S.vibrar ? 'Vibração ligada' : 'Vibração desligada'); } },
    { r: `Cores: ${{ amarelo: 'amarelo no preto', branco: 'branco no preto', claro: 'preto no branco' }[S.tema]}`, a: () => { S.tema = { amarelo: 'branco', branco: 'claro', claro: 'amarelo' }[S.tema]; document.documentElement.dataset.tema = S.tema; salvar(); render(); falar('Cores alteradas.'); } },
    voltar()],
    painel: () => `<div class="cartao"><h3>Seus dados</h3><p class="meta">Tudo fica neste aparelho.</p><div class="fila"><button class="b" id="exportar">Exportar</button><button class="b" id="importar" data-teste="pular">Importar</button><button class="b" id="zerar">Apagar tudo</button></div></div>
      <p class="meta" style="text-align:center;margin-top:12px">VozGuia · Grupo 3 · 8AdmVG · UNIFACC-MT</p>` },
};
function voltar() { return { r: 'Voltar ao início', a: () => irPara('inicio') }; }

let atual = 'inicio', foco = 0, itens = [];
function render() {
  const est = MAQ[atual]; itens = est.itens(); foco = Math.min(foco, itens.length - 1);
  $('#estado').textContent = est.titulo;
  mostrarFoco(false);
  $('#painel').innerHTML = est.painel ? est.painel() : '';
  est.depois && est.depois();
}
function mostrarFoco(narrar = true) {
  const it = itens[foco];
  $('#pad-pos').textContent = `${foco + 1} de ${itens.length}`;
  $('#pad-item').textContent = it.r;
  $('#pad-dica').textContent = it.f && it.f !== it.r ? it.f : 'Toque duas vezes para escolher';
  if (narrar) { falar(it.f || it.r); vibrar('passo'); }
}
const mover = d => { foco = (foco + d + itens.length) % itens.length; mostrarFoco(); };
const escolher = () => { $('#pad').classList.remove('pulso'); void $('#pad').offsetWidth; $('#pad').classList.add('pulso'); vibrar('escolha'); itens[foco].a(); };

/* ---------- gestos no pad ---------- */
(() => {
  const pad = $('#pad'); let x0, y0, t0, segurar, ultimoToque = 0;
  pad.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); segurar = setTimeout(() => { segurar = null; falar(itens[foco].f || itens[foco].r); vibrar('medio'); }, 650); });
  pad.addEventListener('pointerup', e => {
    const dx = e.clientX - x0, dy = e.clientY - y0; const longo = !segurar; clearTimeout(segurar);
    if (longo) return;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) return mover(dx > 0 ? 1 : -1);
    if (Math.abs(dy) > 60) return mover(dy < 0 ? -1 : 1);
    const agora = Date.now(); if (agora - ultimoToque < 350) { ultimoToque = 0; escolher(); } else { ultimoToque = agora; }
  });
  pad.addEventListener('pointercancel', () => clearTimeout(segurar));
  pad.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); mover(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); mover(-1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); escolher(); }
  });
})();
$('#ant').onclick = () => mover(-1); $('#prox').onclick = () => mover(1); $('#ok').onclick = escolher;

/* ---------- ações dos painéis ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const o = S.obst.find(x => x.id === (b.dataset.conf || b.dataset.baixa));
  if (b.dataset.conf) { o.conf++; salvar(); render(); falar('Confirmação registrada.'); }
  else if (b.dataset.baixa) { o.baixa++; if (o.baixa >= 3) { o.ativo = false; falar('Três pessoas deram baixa. Obstáculo marcado como resolvido.'); } else falar('Baixa registrada. Com três baixas, o obstáculo sai do mapa.'); salvar(); render(); }
  else if (b.id === 'n-add') { const local = $('#n-local').value.trim(); if (!local) { vibrar('erro'); return falar('Diga onde fica o obstáculo.'); }
    S.obst.push({ id: 'o' + Date.now().toString(36), tipo: $('#n-tipo').value, local, conf: 1, baixa: 0, ativo: true, m: 40 + Math.round(Math.random() * 220) }); salvar(); render(); falar('Obstáculo adicionado. Outras pessoas poderão confirmar.'); }
  else if (b.id === 'a-ditar') {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return falar('Ditado indisponível neste navegador. Use o teclado.');
    const r = new R(); r.lang = 'pt-BR'; r.onresult = ev => { $('#a-desc').value += ev.results[0][0].transcript + ' '; falar('Anotado.'); }; r.onerror = () => falar('Não consegui ouvir.'); r.start(); falar('Pode falar.', false);
  }
  else if (b.id === 'a-enviar') {
    const local = $('#a-local').value.trim(); if (!local) { vibrar('erro'); $('#a-local').focus(); return falar('Informe o local do problema.'); }
    const prot = 'VG-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-5);
    S.alertas.unshift({ id: Date.now().toString(36), prot, tipo: $('#a-tipo').value, local, desc: $('#a-desc').value.trim(), foto: fotoTemp, etapa: 0, quando: new Date().toISOString() });
    fotoTemp = null; salvar(); foco = 1; render(); falar(`Alerta enviado. Seu protocolo é ${prot.split('').join(' ')}.`);
  }
  else if (b.dataset.avancar) { const a = S.alertas.find(x => x.id === b.dataset.avancar); a.etapa = Math.min(4, a.etapa + 1); salvar(); render(); falar(`Protocolo ${a.prot}: ${ETAPAS[a.etapa]}.`); }
  else if (b.id === 'exportar') { const u = URL.createObjectURL(new Blob([JSON.stringify({ app: 'vozguia', dados: S })], { type: 'application/json' })); Object.assign(document.createElement('a'), { href: u, download: 'vozguia.json' }).click(); falar('Arquivo baixado.'); }
  else if (b.id === 'importar') { const i = Object.assign(document.createElement('input'), { type: 'file', accept: '.json' }); i.onchange = async () => { try { const j = JSON.parse(await i.files[0].text()); if (j.app !== 'vozguia') throw 0; S = j.dados; salvar(); render(); falar('Dados importados.'); } catch (x) { falar('Arquivo inválido.'); } }; i.click(); }
  else if (b.id === 'zerar') { if (confirm('Apagar alertas, obstáculos e ajustes?')) { S = semente(); salvar(); document.documentElement.dataset.tema = S.tema; render(); falar('Tudo apagado.'); } }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'a-foto' || !e.target.files[0]) return;
  try { fotoTemp = await reduzirFoto(e.target.files[0]); const p = $('#a-prev'); p.src = fotoTemp; p.hidden = false; falar('Foto anexada.'); } catch (x) { falar('Não foi possível ler a foto.'); }
});

/* ---------- rotas ---------- */
window.__rotas = ['#/inicio', '#/perto', '#/treino', '#/mapa', '#/alertas', '#/tutorial', '#/ajustes'];
function rota() {
  const nome = (location.hash.match(/^#\/(\w+)/) || [])[1];
  const novo = MAQ[nome] ? nome : 'inicio';
  if (novo !== atual) { MAQ[atual].sair && MAQ[atual].sair(); atual = novo; foco = 0; }
  render(); scrollTo(0, 0); falar(`${MAQ[atual].titulo}. ${itens[0].r}.`, true);
}
addEventListener('hashchange', rota);
rota();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
